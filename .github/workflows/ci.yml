name: CI

on:
  push:

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format

  ui-tests: UI Tests
  needs: lint
  runs-on: ubuntu-latest

  steps:
    - uses: action/checkout@v4

    - uses: action/checkout@v4
      with: node-version: 22

    - run: npm ci
    - run npx playwright install --with-deps
    - run: npm run test:ui


  api-tests:
    name: API Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API tests
        run: npm run test:api

      - name: Run UI tests
        run: npm run test:ui
